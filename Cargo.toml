[package]
name = "jigsaw"
version = "0.1.0"
edition = "2024"

[dependencies]
earcutr = "0.5"
eframe = "0.31"
egui = "0.31"
rand = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
log = "0.4"
uuid = { version = "1", features = ["js"] }
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds (helps wasm iteration):
[profile.dev.package."*"]
opt-level = 2
